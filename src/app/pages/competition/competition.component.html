<div class="container-fluid mt-4">
  <div class="row g-4">

    <div class="col-md-7">
      <div class="card">
        <div class="card-header">
          Competition List
        </div>

        <div class="card-body table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Start</th>
                <th>End</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let item of gridList; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ item.title }}</td>
                <td>{{ item.startDate }}</td>
                <td>{{ item.endDate }}</td>
                <td>
                  <span *ngIf="item.status; else inactive">Active</span>
                  <ng-template #inactive>Inactive</ng-template>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-md-5">
      <div class="card">
        <div class="card-header">
          Add / Edit Competition
        </div>

        <div class="card-body">
          <form (ngSubmit)="onSave()" #competitionForm="ngForm">

            <div class="mb-3">
              <label class="form-label">Title</label>
              <input
                type="text"
                [(ngModel)]="newobj.title"
                name="title"
                class="form-control"
                placeholder="Enter title">
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea
                class="form-control"
                [(ngModel)]="newobj.description"
                name="description"
                rows="3"></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Start Date</label>
                <input
                  type="date"
                  [(ngModel)]="newobj.startDate"
                  name="startDate"
                  class="form-control">
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">End Date</label>
                <input
                  type="date"
                  [(ngModel)]="newobj.endDate"
                  name="endDate"
                  class="form-control">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Status</label>
              <input
                type="text"
                [(ngModel)]="newobj.status"
                name="status"
                class="form-control"
                placeholder="Enter status">
            </div>

            <div class="d-flex justify-content-between">
              <button type="submit" class="btn btn-success btn-custom">
                Save
              </button>

              <button type="reset" class="btn btn-secondary btn-custom">
                Reset
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>

  </div>
</div>
