<div class="container-fluid mt-4">
  <div class="row g-4">

    <!-- 🔹 LEFT: TABLE (col-7) -->
    <div class="col-md-7">
      <div class="card">
        <div class="card-header">
          Competition List
        </div>
        <div class="card-body table-responsive">

          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Start</th>
                <th>End</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>1</td>
                <td>afdaf</td>
                <td>10/01/2026</td>
                <td>10/10/2026</td>
                <td><span class="badge bg-success">Active</span></td>
                <td>
                  <button class="btn btn-sm btn-primary btn-custom">Edit</button>
                  <button class="btn btn-sm btn-danger btn-custom">Delete</button>
                </td>
              </tr>

              <!-- Dynamic rows here -->
            </tbody>
          </table>

        </div>
      </div>
    </div>

    <!-- 🔹 RIGHT: FORM (col-5) -->
    <div class="col-md-5">
      <div class="card">
        <div class="card-header">
          Add / Edit Competition
        </div>

        <div class="card-body">

          <form>

            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" [(ngModel)]="newobj.title" name="title" class="form-control" placeholder="Enter title">
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control"[(ngModel)]="newobj.description" name="title" rows="3"></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Start Date</label>
                <input type="date" [(ngModel)]="newobj.description" class="form-control">
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">End Date</label>
                <input type="date" [(ngModel)]="newobj.description" class="form-control">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Status</label>
              <input type="text" [(ngModel)]="newobj.description" class="form-control" placeholder="Enter status">
            </div>

            <div class="d-flex justify-content-between">
              <button type="submit" class="btn btn-success btn-custom">
                Save
              </button>

              <button type="reset" class="btn btn-secondary btn-custom">
                Reset
              </button>
            </div>

          </form>

        </div>
      </div>
    </div>

  </div>
</div>
