<div class="login-container d-flex align-items-center justify-content-center">

  <div class="login-card shadow">

    <!-- 🔹 Title -->
    <h3 class="text-center mb-4 text-primary fw-bold">Login</h3>

    <!-- 🔹 Email -->
    <div class="form-group mb-3 input-wrapper">
      <i class="bi bi-envelope-fill input-icon"></i>
      <input type="email" class="form-control" placeholder="Email Address">
    </div>

    <!-- 🔹 Password -->
    <div class="form-group mb-3 input-wrapper">
      <i class="bi bi-lock-fill input-icon"></i>
      <input type="password" class="form-control" placeholder="Password">
    </div>

    <!-- 🔹 Remember + Forgot -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <input type="checkbox" id="remember">
        <label for="remember" class="ms-1">Remember me</label>
      </div>
      <a href="#" class="text-primary small">Forgot Password?</a>
    </div>

    <!-- 🔹 Button -->
    <button class="btn btn-primary w-100 mb-3">Login</button>

    <!-- 🔹 Signup -->
    <p class="text-center mb-0">
      Don't have an account?
      <a routerLink="/register" class="text-primary fw-semibold">Sign Up</a>
    </p>

  </div>

</div>
